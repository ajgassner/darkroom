# Publishes a release: Actions → Release → Run workflow, then pick how to bump the version.
# Runs the full CI first, then bumps package.json, commits, tags v<version> and creates the GitHub release
# with notes generated from the merged pull requests (categories in .github/release.yml). The installers and
# the update hint in darkroom pick up the new release from there.
# main only accepts pull requests; the release commit is pushed with the deploy key in RELEASE_DEPLOY_KEY,
# the only actor allowed to bypass that rule.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none: release the version in package.json as it is)"
        type: choice
        options: [patch, minor, major, none]
        default: minor

permissions:
  contents: read

concurrency:
  group: release

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: jdx/mise-action@v5
        with:
          install_args: node

      - name: Bump version, commit and tag
        id: version
        run: |
          if [ "${{ inputs.bump }}" != none ]; then
            npm version "${{ inputs.bump }}" --no-git-tag-version >/dev/null
          fi
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "::error::v$version is already released; pick a bump other than none"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git commit -am "Release v$version"
          fi
          git tag "v$version"
          git push origin HEAD:main "v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes --title "darkroom v${{ steps.version.outputs.version }}"
