# Publishes a release: Actions → Release → Run workflow, then pick how to bump the version.
# Runs the full CI first, then bumps package.json, commits, tags v<version> and creates the GitHub release
# with notes generated from the merged pull requests (categories in .github/release.yml). The installers and
# the update hint in darkroom pick up the new release from there.
# main only accepts pull requests; the release commit is pushed with the deploy key in RELEASE_DEPLOY_KEY,
# the only actor allowed to bypass that rule. Only the push step sees the key.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none: release the version in package.json as it is)"
        type: choice
        options: [patch, minor, major, none]
        default: minor

permissions:
  contents: read

concurrency:
  group: release

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main (this run started on $GITHUB_REF_NAME)"
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release commit must sit directly on the main that CI checked
      - name: Check that main has not moved on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main" != "$(git rev-parse HEAD)" ]; then
            echo "::error::main moved on to $main while the release ran on $(git rev-parse HEAD); run the release again"
            exit 1
          fi

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node

      - name: Bump version, commit and tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != none ]; then
            npm version "$BUMP" --no-git-tag-version --ignore-scripts >/dev/null
          fi
          version=$(node -p "require('./package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git commit -am "Release v$version"
          fi
          git tag "v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # The deploy key lives only in this step: in a private temporary folder, removed when the step ends.
      # GitHub's SSH host keys come from its API (over HTTPS), so the host is verified, not trusted on first use.
      # --atomic: main and the tag are updated together or not at all (a moved main rejects both).
      - name: Push the release commit and tag
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$ssh_dir/key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          remote="git@github.com:$GITHUB_REPOSITORY.git"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released; pick a bump other than none"
            exit 1
          fi
          # A tag without a release is left over from a run that failed after pushing: if it points at this
          # commit, only the release is missing, so pushing is skipped and the next step creates it
          tagged=$(git ls-remote --tags "$remote" "refs/tags/v$VERSION" | cut -f1)
          if [ -n "$tagged" ]; then
            if [ "$tagged" = "$(git rev-parse HEAD)" ]; then
              echo "v$VERSION is already tagged on this commit; creating the missing release"
              exit 0
            fi
            echo "::error::Tag v$VERSION exists on another commit ($tagged); delete it or pick another bump"
            exit 1
          fi
          git push --atomic "$remote" HEAD:refs/heads/main "refs/tags/v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes --title "darkroom v$VERSION"
